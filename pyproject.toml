[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curlrecon"
version = "0.1.0"
description = "Advanced CLI reconnaissance tool and HTML report generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Security Tools Engineer" },
]
dependencies = [
    "httpx>=0.27.0",
    "httpx[http2]>=0.27.0",
    "httpx[socks]>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0"
]

[project.scripts]
curlrecon = "curlrecon.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0"
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88
